name: explorer
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install marimo==0.25.1 plotly==7.1.0 uv==0.12.19
      - run: python scripts/build_explorer_data.py --check
      - run: marimo check --strict notebooks/explore_results.py
      - run: python -m unittest discover -s tests -p test_explorer.py -v
      - run: marimo export html notebooks/explore_results.py -o /tmp/explorer-static.html
      - run: marimo export html-wasm notebooks/explore_results.py -o /tmp/explorer-wasm --mode run
